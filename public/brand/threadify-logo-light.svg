<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" aria-label="Threadify — Your Style, Our Stitch">
  <!-- Needle icon (orange on dark) -->
  <g transform="translate(8, 8)">
    <rect x="18.5" y="12" width="3" height="68" rx="1.5" fill="#FF7A00"/>
    <polygon points="18.5,80 21.5,80 20,95" fill="#FF7A00"/>
    <ellipse cx="20" cy="18" rx="3.5" ry="5" fill="none" stroke="#FF7A00" stroke-width="2.5"/>
    <path d="M20,16 C20,16 -4,2 6,28 C12,42 38,8 44,22 C50,36 28,52 20,46" stroke="#FF7A00" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Wordmark: white for dark backgrounds -->
  <text x="68" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" letter-spacing="-1" fill="#ffffff">THREADIFY</text>
  <!-- Tagline: soft white -->
  <text x="70" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11.5" letter-spacing="4" fill="rgba(255,255,255,0.65)">YOUR STYLE • OUR STITCH</text>
</svg>
